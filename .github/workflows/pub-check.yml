# Fork-local publication-assurance gate for the issue-111-pdf-fonts branch.
#
# Runs the OASIS publication acceptance criteria (oasis-pub-check, 169 checks /
# 57 classes, github.com/OASIS-Docs/publication-assurance) against the three
# ACAL-family core specification packages already built from this branch's own
# pandoc/mkdocs.sh pipeline and committed under pubcheck-pkg/ (csd02 candidate
# packages: ACAL core, JACAL/JSON core, XACML/XML core).
#
# TEMPORARILY pointed at OASIS-Docs/publication-assurance's
# feature/action-report-output branch (an open PR, not yet merged) instead of
# the published v1 tag, to verify the action's new native report-dir /
# write-summary / summary-title inputs end to end on a real run before that
# PR merges. The workflow is now much shorter than the previous cut: the
# action itself writes pubcheck-report.txt/.json and the GitHub Step Summary
# section per package, this workflow only adds the upload-artifact step.
# Revert the `uses:` ref back to `@v1` once the PR is tagged into a release.
#
# Any blocker fails the job; warnings do not.

name: pub-check

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: "Stage directory or package .zip to check (overrides the matrix below when set)"
        required: false

permissions:
  contents: read

jobs:
  pub-check:
    name: "pub-check / ${{ matrix.package.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - id: acal-core-v1.0
            name: "ACAL core v1.0 csd02"
            target: pubcheck-pkg/acal/core/v1.0/csd02
          - id: jacal-core-v1.0
            name: "JACAL (JSON profile) core v1.0 csd02"
            target: pubcheck-pkg/jacal/core/v1.0/csd02
          - id: xacml-core-v4.0
            name: "XACML (XML profile) core v4.0 csd02"
            target: pubcheck-pkg/xacml/core/v4.0/csd02
    steps:
      - name: Checkout xacml-spec
        uses: actions/checkout@v4

      - name: Run oasis-pub-check (${{ matrix.package.name }})
        uses: OASIS-Docs/publication-assurance@feature/action-report-output
        with:
          target: ${{ github.event.inputs.target || matrix.package.target }}
          report-dir: pubcheck-report-${{ matrix.package.id }}
          summary-title: ${{ matrix.package.name }}

      - name: Upload pub-check report (${{ matrix.package.id }})
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pubcheck-report-${{ matrix.package.id }}
          path: pubcheck-report-${{ matrix.package.id }}
          if-no-files-found: error

      - name: Note artifact location in summary
        if: always() && steps.upload.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_NAME: pubcheck-report-${{ matrix.package.id }}
        run: |
          echo "**Full report artifact:** [${ARTIFACT_NAME}](${ARTIFACT_URL}) (txt + json)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
